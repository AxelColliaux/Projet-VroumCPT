services:
  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: vroumcpt-kafka-secure
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Client traffic uses SASL_SSL. The isolated KRaft controller listener
      # uses SASL/PLAIN; it is never published outside the Docker network.
      KAFKA_CFG_LISTENERS: SASL_SSL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_SSL

      # SASL
      KAFKA_CLIENT_LISTENER_NAME: SASL_SSL
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_INTER_BROKER_USER: broker
      KAFKA_INTER_BROKER_PASSWORD: "${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in .env}"
      KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_CONTROLLER_USER: controller
      KAFKA_CONTROLLER_PASSWORD: "${KAFKA_CONTROLLER_PASSWORD:?Set KAFKA_CONTROLLER_PASSWORD in .env}"

      # SSL
      KAFKA_CFG_SSL_KEYSTORE_TYPE: JKS
      KAFKA_CFG_SSL_KEYSTORE_LOCATION: /opt/bitnami/kafka/config/certs/kafka.keystore.jks
      KAFKA_CFG_SSL_KEYSTORE_PASSWORD: "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"
      KAFKA_CFG_SSL_KEY_PASSWORD: "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"
      KAFKA_CFG_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_CFG_SSL_TRUSTSTORE_LOCATION: /opt/bitnami/kafka/config/certs/kafka.truststore.jks
      KAFKA_CFG_SSL_TRUSTSTORE_PASSWORD: "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"
      KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_TLS_TYPE: JKS
      KAFKA_CERTIFICATE_PASSWORD: "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"

      # Authorization: deny by default and bypass ACL checks only for internal
      # service principals and the dedicated administrator.
      KAFKA_CFG_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_CFG_SUPER_USERS: User:admin;User:broker;User:controller

      # Bootstrap the administrator. Application SCRAM credentials are created
      # by kafka-init once the secured broker is healthy.
      KAFKA_CLIENT_USERS: admin
      KAFKA_CLIENT_PASSWORDS: "${KAFKA_ADMIN_PASSWORD:?Set KAFKA_ADMIN_PASSWORD in .env}"

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka_secure_data:/bitnami/kafka
      - ./config/ssl:/opt/bitnami/kafka/config/certs:ro
      - ./config/ssl:/opt/ssl:ro
    healthcheck:
      test: >
        kafka-topics.sh
        --bootstrap-server localhost:9092
        --command-config /opt/ssl/client-admin.properties
        --list
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-init:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: vroumcpt-kafka-init-secure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_GENERATOR_PASSWORD: "${KAFKA_GENERATOR_PASSWORD:?Set KAFKA_GENERATOR_PASSWORD in .env}"
      KAFKA_SPARK_PASSWORD: "${KAFKA_SPARK_PASSWORD:?Set KAFKA_SPARK_PASSWORD in .env}"
    volumes:
      - ./config/ssl:/opt/ssl:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail

        kafka-configs.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --alter --entity-type users --entity-name generator \
          --add-config "SCRAM-SHA-256=[iterations=8192,password=$${KAFKA_GENERATOR_PASSWORD}]"

        kafka-configs.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --alter --entity-type users --entity-name spark \
          --add-config "SCRAM-SHA-256=[iterations=8192,password=$${KAFKA_SPARK_PASSWORD}]"

        kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --create --if-not-exists \
          --topic vehicle-states --partitions 3 --replication-factor 1

        kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --create --if-not-exists \
          --topic alerts --partitions 1 --replication-factor 1

        # Grant generator write access to vehicle-states
        kafka-acls.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --add --allow-principal User:generator \
          --producer --topic vehicle-states

        # Grant spark read from vehicle-states, write to alerts
        kafka-acls.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --add --allow-principal User:spark \
          --consumer --topic vehicle-states --group spark-streaming

        kafka-acls.sh \
          --bootstrap-server kafka:9092 \
          --command-config /opt/ssl/client-admin.properties \
          --add --allow-principal User:spark \
          --producer --topic alerts

        echo 'Topics and ACLs configured.'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vroumcpt-kafka-ui-secure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vroumcpt-secure
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?Set KAFKA_ADMIN_PASSWORD in .env}";
      KAFKA_CLUSTERS_0_SSL_TRUSTSTORELOCATION: /opt/ssl/kafka.truststore.jks
      KAFKA_CLUSTERS_0_SSL_TRUSTSTOREPASSWORD: "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"
    volumes:
      - ./config/ssl:/opt/ssl:ro

  generator:
    build: ./generator
    container_name: vroumcpt-generator-secure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./config/ssl:/opt/ssl:ro
    command:
      - --kafka-broker
      - kafka:9092
      - --rate
      - "5"
      - --error-vehicle-pct
      - "0.4"
      - --high-error-rate
      - "0.7"
      - --security-protocol
      - SASL_SSL
      - --sasl-mechanism
      - SCRAM-SHA-256
      - --sasl-username
      - generator
      - --sasl-password
      - "${KAFKA_GENERATOR_PASSWORD:?Set KAFKA_GENERATOR_PASSWORD in .env}"
      - --ssl-cafile
      - /opt/ssl/ca.crt
    restart: on-failure

  spark-streaming:
    build: ./streaming
    container_name: vroumcpt-spark-secure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./config/ssl:/opt/ssl:ro
      - ./output:/app/output
      - spark_secure_checkpoints:/tmp/vroumcpt-checkpoints
    command:
      - --source
      - kafka
      - --kafka-broker
      - kafka:9092
      - --sink
      - kafka
      - --group-id
      - spark-streaming
      - --window-duration
      - "30 seconds"
      - --trigger-interval
      - "10 seconds"
      - --kafka-security-protocol
      - SASL_SSL
      - --kafka-sasl-mechanism
      - SCRAM-SHA-256
      - --kafka-sasl-jaas-config
      - >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="spark" password="${KAFKA_SPARK_PASSWORD:?Set KAFKA_SPARK_PASSWORD in .env}";
      - --ssl-truststore-location
      - /opt/ssl/kafka.truststore.jks
      - --ssl-truststore-password
      - "${KAFKA_CERTIFICATE_PASSWORD:?Set KAFKA_CERTIFICATE_PASSWORD in .env}"
    restart: on-failure

volumes:
  kafka_secure_data:
  spark_secure_checkpoints:
