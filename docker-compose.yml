services:
  kafka:
    image: apache/kafka:latest
    container_name: vroumcpt-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Two listeners:
      #  PLAINTEXT  → docker-internal (kafka-init, kafka-ui)  kafka:9092
      #  EXTERNAL   → host apps (generator.py, spark-submit)  localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"    # docker-internal
      - "29092:29092"  # host access
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-init:
    image: apache/kafka:latest
    container_name: vroumcpt-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle-states --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1 &&
      echo 'Topics created.'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vroumcpt-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vroumcpt
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  generator:
    build: ./generator
    container_name: vroumcpt-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - --kafka-broker
      - kafka:9092
      - --rate
      - "5"
      - --error-vehicle-pct
      - "0.4"
      - --high-error-rate
      - "0.7"
    restart: on-failure

  spark-streaming:
    build: ./streaming
    container_name: vroumcpt-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - --source
      - kafka
      - --kafka-broker
      - kafka:9092
      - --sink
      - kafka
      - --window-duration
      - "30 seconds"
      - --trigger-interval
      - "10 seconds"
    volumes:
      - ./output:/app/output
      - spark_checkpoints:/tmp/vroumcpt-checkpoints
    restart: on-failure

volumes:
  kafka_data:
  spark_checkpoints:
